<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HARMIC RECHARGE</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback: store the requested path and redirect to index.html
      (function () {
        var segment = 1; // number of path segments in the base URL (e.g. / = 0, /app = 1)
        var location = window.location;
        var path = location.pathname;
        var search = location.search || '';
        var hash = location.hash || '';
        var redirectUrl = location.origin + '/';
        var requestedPath = path + search + hash;

        // Save the full requested path so index.html can restore it after React loads
        sessionStorage.setItem('gh-pages-spa-path', requestedPath);

        location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
