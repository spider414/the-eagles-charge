# Build signed iOS IPA and Android AAB on tag push.
#
# Trigger: tags matching v*.*.*  (e.g. v1.2.3) or v*.*.*-N (e.g. v1.2.3-42)
#   - marketing version = tag without leading `v`, without `-N` build suffix
#   - build number      = the `-N` suffix if present, else GITHUB_RUN_NUMBER
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   iOS:
#     IOS_P12_BASE64          Base64 of the Distribution .p12
#     IOS_P12_PASSWORD        Password for the .p12
#     IOS_PROVISIONING_PROFILE_BASE64   Base64 of the App Store .mobileprovision
#     IOS_KEYCHAIN_PASSWORD   Any strong string (used to unlock the tmp keychain)
#     IOS_TEAM_ID             10-char Apple Developer team ID
#     APPSTORE_API_KEY_ID     App Store Connect API key ID   (upload only)
#     APPSTORE_API_ISSUER_ID  App Store Connect issuer ID    (upload only)
#     APPSTORE_API_KEY_BASE64 Base64 of AuthKey_XXXX.p8      (upload only)
#   Android:
#     ANDROID_KEYSTORE_BASE64 Base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD

name: Mobile Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.2.3)"
        required: true
      build:
        description: "Build number (integer)"
        required: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Guard: only run on tag pushes or manual dispatch. Prevents "No jobs were run"
    # failure emails when GitHub evaluates the workflow on unrelated events.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.parse.outputs.version }}
      build: ${{ steps.parse.outputs.build }}
    steps:
      - id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            B="${{ inputs.build }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
            V="${RAW%%-*}"
            case "$RAW" in *-*) B="${RAW#*-}";; *) B="";; esac
          fi
          [ -z "$B" ] && B="${GITHUB_RUN_NUMBER}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$B"   >> "$GITHUB_OUTPUT"
          echo "Release $V ($B)"

  android:
    needs: version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD:   ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - run: npm ci
      - run: npx cap add android || true
      - run: npm run cap:sync

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
          cat > android/keystore.properties <<EOF
          storeFile=upload.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Clean secrets
        if: always()
        run: rm -f android/app/upload.keystore android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD:   ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npx cap add ios || true
      - run: npm run cap:sync

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          echo "$P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

      - name: Write ExportOptions with team ID
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.IOS_TEAM_ID }}" ios/ExportOptions.plist || \
            /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.IOS_TEAM_ID }}" ios/ExportOptions.plist

      - name: Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} \
            archive | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa | xcpretty && exit ${PIPESTATUS[0]}

      - name: Upload to TestFlight
        if: ${{ secrets.APPSTORE_API_KEY_ID != '' }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          IPA=$(ls $RUNNER_TEMP/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Clean secrets
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true
          rm -rf ~/private_keys $RUNNER_TEMP/cert.p12

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error