# Fails the build if index.html or public/manifest.json reintroduce
# any PWA install-prompt hooks. This project ships as a native
# Capacitor app; the browser "Install app" UI must stay disabled.
name: No PWA Install Prompt

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check for install-related PWA settings
        run: node scripts/check-no-pwa-install.mjs